<canvas #spaceCanvas class="space-bg"></canvas>

<div class="todo-shell">


  <h1 class="title">STAR WARS</h1>

  <div class="options-container">

    <div class="option">
      <button class="option-btn" (click)="toggleDropdown('characters')">
        Postacie
      </button>

  <div class="dropdown" *ngIf="openDropdown === 'characters'">
    <div *ngFor="let character of characters">
      <button (click)="goToCharacter(character.id); playLightsaber()">
        {{ character.name }}  
      </button>
    </div>
  </div>
</div>
 

  <div class="option">
  <button class="option-btn" (click)="toggleDropdown('planets')">
    Planety
  </button>

  <div class="dropdown" *ngIf="openDropdown === 'planets'">
    <div *ngFor="let planet of planets">
      <button (click)="goToPlanet(planet.id); playBlaster()">
        {{ planet.name }}
      </button>
    </div>
  </div>
</div>

  
  <div class="option">
  <button class="option-btn" (click)="toggleDropdown('vehicles')">
    Pojazdy
  </button>

  <div class="dropdown" *ngIf="openDropdown === 'vehicles'">
    <div *ngFor="let vehicle of vehicles">
      <button (click)="goToVehicles(vehicle.id); playBlaster()">
        {{ vehicle.name }}
      </button>
    </div>
  </div>
</div>

  
 <div class="option">
  <button class="option-btn" (click)="toggleDropdown('species')">
    Gatunki
  </button>

  <div class="dropdown" *ngIf="openDropdown === 'species'">
    <div *ngFor="let s of species">
      <button (click)="goToSpecies(s.id); playBlaster()">
        {{ s.name }}
      </button>
    </div>
  </div>
</div>

 
  <div class="option">
  <button class="option-btn" (click)="toggleDropdown('starships')">
    Statki kosmiczne
  </button>

  <div class="dropdown" *ngIf="openDropdown === 'starships'">
    <div *ngFor="let ship of starships">
      <button (click)="goToSpaceships(ship.id); playBlaster()">
        {{ ship.name }}
      </button>
    </div>
  </div>
</div>
<div class="search-box">
  <input 
    type="text" 
    placeholder="Szukaj w całej galaktyce..."
    [(ngModel)]="searchText"
    (input)="search()"
  />

  <div class="search-results" *ngIf="searchResults.length > 0">
    <div *ngFor="let r of searchResults">
      <button (click)="goToResult(r); playLightsaber()">
        {{ r.name }}
      </button>
    </div>
  </div>
  </div>
  <div class="crawl-container">
  <div class="crawl">
    <div class="crawl-text" style="font-size: 20px; font-weight: 900; font-family: 'Franklin Gothic Medium', 'Arial Black', sans-serif;">
      {{ crawlText }}
    </div>
  </div>
</div>
