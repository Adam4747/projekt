<div *ngIf="loading">
  Ładowanie statków kosmicznych...
</div>
<div *ngIf="!loading && spaceships" class="spaceships-container">

  <div class="spaceships-card">

    <div class="spaceships-image">
      <img [src]="images[routeId || ''] || ''" />
    </div>

    <div class="spaceships-details">
      <h1 class="spaceships-name">{{ spaceships.name }}</h1>

      <p><b>Model:</b> {{ spaceships.model }} </p>
      <p><b>Twórca:</b> {{ spaceships.creator }}</p>
      <p><b>Cena:</b> {{ spaceships.price }} credits</p>
      <p><b>Długość:</b> {{ spaceships.length }} </p>
      <p><b>Maksymalna prędkość:</b> {{ spaceships.maxSpeed }} km/h</p> <br>

      <p class="spaceships-descriptions">
        {{ descriptions[routeId || ''] }}
      </p>

    </div>
  </div>
</div>
